<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SIESA Fitosanitario</title>

    <meta name="theme-color" content="#064e2b" />
    <meta name="description" content="Sistema SIESA Fitosanitario para control agrícola, evaluaciones, lotes, fincas, alertas y GPS." />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then(() => console.log("Service Worker registrado correctamente"))
            .catch((error) => console.log("Error registrando Service Worker:", error));
        });
      }
    </script>
  </body>
</html>
